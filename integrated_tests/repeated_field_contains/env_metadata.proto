syntax = "proto3";

package envmetadata;

// Simplified version of the CPK EnvMetadata service.
// The real issue: consumer only cares that "PUBLIC" is in the networking array,
// but the provider returns ["PUBLIC", "PRIVATE_LINK", "TRANSIT_GATEWAY"].

service EnvMetadataService {
  rpc GetEnvMetadata(EnvMetadataRequest) returns (EnvMetadataResponse);
}

message EnvMetadataRequest {
  string cloud = 1;
  string region = 2;
}

message EnvMetadataResponse {
  string type_name = 1;
  repeated string durability = 2;
  repeated string networking = 3;
}

message NetworkConfig {
  string type = 1;
  string endpoint = 2;
}

message EnvMetadataResponseV2 {
  string type_name = 1;
  repeated NetworkConfig networking = 2;
}

service EnvMetadataServiceV2 {
  rpc GetEnvMetadataV2(EnvMetadataRequest) returns (EnvMetadataResponseV2);
}
