[workspace]

[package]
name = "repeated_field_contains_provider"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13.1"
prost-types = "0.13.1"
tokio = { version = "1.37.0", features = ["full"] }
tonic = "0.12.1"
tracing = "0.1.40"
tracing-core = "0.1.32"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "tracing-log"] }

[dev-dependencies]
test-log = "0.2.15"
pact_verifier = "~1.3.2"
pact_models = "~1.3.4"
pact-plugin-driver = "0.7.0"
env_logger = "0.11.3"
maplit = "1.0.2"
serde_json = "1.0"
tokio-stream = "0.1"
async-trait = "0.1"
anyhow = "1.0"
reqwest = "0.12"

[build-dependencies]
tonic-build = "0.12.1"
